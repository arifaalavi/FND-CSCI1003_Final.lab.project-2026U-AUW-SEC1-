<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Virtual Wardrobe & Outfit Planner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: rgb(244, 173, 185); color: #333; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { color: #2c3e50; }

    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .highlight { background: #eef6ff; border: 1px solid #cce4ff; }
    .full-width { grid-column: 1 / -1; }

    form { display: flex; flex-direction: column; gap: 12px; }
    input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { background: #2563eb; color: white; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background: #1d4ed8; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
    .item-card { border: 1px solid #eee; border-radius: 8px; padding: 10px; background: #fff; text-align: center; }
    .item-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; }
    .badge { display: inline-block; padding: 3px 8px; font-size: 12px; border-radius: 12px; background: #e2e8f0; margin-top: 5px; }

    .outfit-display { display: flex; gap: 10px; margin-top: 15px; justify-content: space-around; font-weight: bold; }
    .outfit-slot { border: 2px dashed #93c5fd; padding: 10px; border-radius: 8px; width: 30%; text-align: center; background: white; }

    @media (max-width: 600px) {
      .container { grid-template-columns: 1fr; }
      .outfit-display { flex-direction: column; }
      .outfit-slot { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>👔 StyleSync: Virtual Wardrobe</h1>
    <p>Organize your clothes & generate instant outfits</p>
  </header>

  <main class="container">
    <!-- Section 1: Add New Item -->
    <section class="card">
      <h2>Add Wardrobe Item</h2>
      <form id="wardrobeForm">
        <input type="text" id="itemName" placeholder="Item Name (e.g., Denim Jacket)" required />
        <select id="itemCategory" required>
          <option value="">Select Category</option>
          <option value="Top">Top</option>
          <option value="Bottom">Bottom</option>
          <option value="Shoes">Shoes</option>
        </select>
        <select id="itemOccasion">
          <option value="Casual">Casual</option>
          <option value="Formal">Formal</option>
          <option value="Sport">Sport</option>
        </select>
        <input type="url" id="imageUrl" placeholder="Image URL (optional)" />
        <button type="submit">Add to Wardrobe</button>
      </form>
    </section>

    <!-- Section 2: Random Outfit Generator -->
    <section class="card highlight">
      <h2>🎲 Smart Outfit Generator</h2>
      <button id="generateBtn">Generate Random Outfit</button>
      <div id="outfitDisplay" class="outfit-display">
        <p>Click the button above to generate a full outfit!</p>
      </div>
    </section>

    <!-- Section 3: Wardrobe Collection -->
    <section class="card full-width">
      <h2>My Closet</h2>
      <div id="wardrobeGrid" class="grid"></div>
    </section>
  </main>

  <script>
    // Initial sample items
    let wardrobe = [
      { id: 1, name: "White Shirt", category: "Top", occasion: "Casual", image: "Shirt_Wh_1_jpg.webp" },
      { id: 2, name: "Blue Jeans", category: "Bottom", occasion: "Casual", image: "Image_4.jpg" },
      { id: 3, name: "White sneakers", category: "Shoes", occasion: "Casual", image: "Female-Footwear-Graceful-Lace-up-Women-s-Sneakers-White-Shoes-Woman-Sport-Shoe-Lady-Sneaker.avif" }
    ];

    const form = document.getElementById("wardrobeForm");
    const grid = document.getElementById("wardrobeGrid");
    const generateBtn = document.getElementById("generateBtn");
    const outfitDisplay = document.getElementById("outfitDisplay");

    // Render Wardrobe Items
    function renderWardrobe() {
      grid.innerHTML = wardrobe.map(item => `
        <div class="item-card">
          <img src="${item.image || 'https://via.placeholder.com/150'}" alt="${item.name}">
          <h4>${item.name}</h4>
          <span class="badge">${item.category}</span>
          <span class="badge">${item.occasion}</span>
        </div>
      `).join("");
    }

    // Add Item
    form.addEventListener("submit", (e) => {
      event.preventDefault();
      const newItem = {
        id: Date.now(),
        name: document.getElementById("itemName").value,
        category: document.getElementById("itemCategory").value,
        occasion: document.getElementById("itemOccasion").value,
        image: document.getElementById("imageUrl").value || 'https://via.placeholder.com/150'
      };
      wardrobe.push(newItem);
      renderWardrobe();
      form.reset();
    });

    // Generate Random Outfit
    generateBtn.addEventListener("click", () => {
      const tops = wardrobe.filter(i => i.category === "Top");
      const bottoms = wardrobe.filter(i => i.category === "Bottom");
      const shoes = wardrobe.filter(i => i.category === "Shoes");

      if (!tops.length || !bottoms.length || !shoes.length) {
        alert("Please ensure you have at least one Top, Bottom, and Shoes in your wardrobe!");
        return;
      }

      const randomTop = tops[Math.floor(Math.random() * tops.length)];
      const randomBottom = bottoms[Math.floor(Math.random() * bottoms.length)];
      const randomShoes = shoes[Math.floor(Math.random() * shoes.length)];

      outfitDisplay.innerHTML = `
        <div class="outfit-slot">👕 ${randomTop.name}</div>
        <div class="outfit-slot">👖 ${randomBottom.name}</div>
        <div class="outfit-slot">👟 ${randomShoes.name}</div>
      `;
    });

    // Initial Render
    renderWardrobe();
  </script>
</body>
</html>
